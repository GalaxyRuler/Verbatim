name: "Desktop Parity"

# Manual desktop build lane for proving Windows x64, macOS Apple Silicon, and
# Ubuntu x64 from the same ref without publishing a release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Leave empty to build the workflow ref."
        required: false
        default: ""
        type: string
      build_profile:
        description: "Build profile"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
      sign_macos:
        description: "Sign macOS artifacts if Apple Developer secrets are configured"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}-${{ inputs.build_profile }}
  cancel-in-progress: true

jobs:
  desktop-parity:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            release_args: ""
            debug_args: "--debug"
          - platform: "macos-26"
            target: "aarch64-apple-darwin"
            release_args: "--target aarch64-apple-darwin"
            debug_args: "--debug --target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            release_args: "--bundles deb"
            debug_args: "--debug --bundles deb"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ inputs.build_profile == 'debug' && matrix.debug_args || matrix.release_args }}
      sign-binaries: ${{ matrix.platform == 'macos-26' && inputs.sign_macos || false }}
      asset-prefix: "verbatim-desktop-parity"
      upload-artifacts: true
      ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      is-debug-build: ${{ inputs.build_profile == 'debug' }}
    secrets: inherit
