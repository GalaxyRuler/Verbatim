# Nix CI — two tiers:
#
# 1. Repo health checks run on ANY source change and produce a compact
#    artifact/step-summary evidence trail.
# 2. Quick nix checks (bun.nix sync, flake eval) run on ANY source change
#    so compilation-breaking edits are caught by flake eval.
# 3. Full nix build (~25 min) runs only when nix packaging files change,
#    nightly, or manually.
#
# The GalaxyRuler Cachix cache is configured for pulls on every run and pushes
# when the repository has CACHIX_AUTH_TOKEN configured.

name: "nix build check"
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translations
        run: bun run check:translations

      - name: Lint frontend
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Write CI evidence summary
        if: always()
        run: |
          {
            echo "# Verbatim CI Evidence"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Checks: bun install --frozen-lockfile, translations, lint, frontend build, cargo fmt"
          } | tee ci-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: ci-evidence.md
          if-no-files-found: error

  nix-build:
    needs: repo-health
    runs-on: ubuntu-24.04
    continue-on-error: false
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure GalaxyRuler Cachix cache (pull and push)
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: galaxyruler
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure GalaxyRuler Cachix cache (pull only)
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@v17
        with:
          name: galaxyruler
          skipPush: true

      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      # Regenerate .nix/bun.nix from bun.lock and check if it matches
      # what's committed. A diff means the developer forgot to run
      # bun scripts/check-nix-deps.ts or bun install (which triggers it).
      - name: Check bun.nix is up to date
        id: bun-check
        run: |
          bunx bun2nix -o .nix/bun.nix
          if ! git diff --quiet .nix/bun.nix; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hint on outdated bun.nix
        if: steps.bun-check.outputs.outdated == 'true'
        run: |
          echo ""
          echo "::warning::.nix/bun.nix is out of sync with bun.lock"
          echo ""
          echo "┌──────────────────────────────────────────────────────────────┐"
          echo "│  .nix/bun.nix is outdated. To fix, run:                      │"
          echo "│                                                              │"
          echo "│    bun scripts/check-nix-deps.ts                             │"
          echo "│                                                              │"
          echo "│  Or simply run 'bun install' — the postinstall hook will     │"
          echo "│  regenerate it automatically. Commit the resulting changes.  │"
          echo "└──────────────────────────────────────────────────────────────┘"
          echo ""
          echo "Diff:"
          git diff .nix/bun.nix
          exit 1

      # Evaluate the flake to catch issues with cargo git dependency hashes,
      # missing inputs, or other Nix expression errors.
      # Skip if bun.nix is already outdated — nix eval would fail with a
      # cryptic error, and the bun-check step already printed a clear message.
      - name: Check flake evaluation
        if: steps.bun-check.outputs.outdated != 'true'
        id: eval
        run: |
          if ! nix eval .#packages.x86_64-linux.verbatim.drvPath 2>eval_err.log; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            cat eval_err.log
          fi

      - name: Hint on evaluation failure
        if: steps.eval.outputs.failed == 'true'
        run: |
          echo ""
          echo "::warning::flake.nix evaluation failed"
          echo ""
          cat eval_err.log
          exit 1

      # Detect whether nix packaging files changed. If only source code changed,
      # the quick checks above are sufficient. Scheduled and manual runs always
      # execute the full build.
      - name: Check if nix packaging files changed
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: nix-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
              --paginate --jq '.[].filename' > changed_files.txt
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD^"
            fi
            git diff --name-only "$base" "${{ github.sha }}" > changed_files.txt
          fi

          cat changed_files.txt

          if grep -qE '^(flake\.(nix|lock)|\.nix/|bun\.lock|src-tauri/(Cargo\.(toml|lock)|tauri\.conf\.json|build\.rs))' changed_files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Full build — catches runtime build errors (broken dependencies,
      # sandbox issues, compilation failures) that flake eval alone misses.
      # On PRs: only runs when nix packaging files change (~25 min with cold cache).
      # On push to main: also only runs when nix packaging files change.
      # On workflow_dispatch and the nightly schedule: always runs.
      - name: Build Verbatim
        if: steps.bun-check.outputs.outdated != 'true' && steps.eval.outputs.failed != 'true' && (steps.nix-files.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: nix build .#verbatim -L --show-trace
