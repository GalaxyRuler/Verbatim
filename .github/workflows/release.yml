name: "Release"

on:
  workflow_dispatch:
    inputs:
      sign_binaries:
        description: "Sign platform binaries and updater artifacts using configured secrets"
        required: false
        default: false
        type: boolean

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check version consistency
        run: bun run check:version

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.get-version.outputs.version }}`;
            let data;

            try {
              ({ data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;

              ({ data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                draft: true,
                prerelease: false,
                generate_release_notes: true
              }));
            }

            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: ${{ inputs.sign_binaries }}
      create-updater-artifacts: true
      asset-prefix: "verbatim"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  finalize-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - create-release
      - publish-tauri
    steps:
      - name: Verify updater release assets
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = Number('${{ needs.create-release.outputs.release-id }}');
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            const names = assets.map((asset) => asset.name).sort();
            const latestJson = names.includes('latest.json');
            const signatures = names.filter((name) => name.endsWith('.sig'));

            if (!latestJson) {
              core.setFailed(`Missing latest.json. Assets found: ${names.join(', ')}`);
              return;
            }

            if (signatures.length === 0) {
              core.setFailed(`Missing updater .sig assets. Assets found: ${names.join(', ')}`);
              return;
            }

            core.info(`Found latest.json and ${signatures.length} updater signature assets.`);

      - name: Publish release with download guidance
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.create-release.outputs.version }}';
            const tag = `v${version}`;
            const releaseId = Number('${{ needs.create-release.outputs.release-id }}');
            const signed = '${{ inputs.sign_binaries }}' === 'true';
            const latestDownload = (name) =>
              `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/latest/download/${name}`;

            const rows = [
              ['Windows x64', 'Setup EXE', `Verbatim_${version}_x64-setup.exe`],
              ['Windows x64', 'MSI', `Verbatim_${version}_x64_en-US.msi`],
              ['macOS Apple Silicon', 'DMG', `Verbatim_${version}_aarch64.dmg`],
              ['Ubuntu x64', 'DEB', `Verbatim_${version}_amd64.deb`],
            ];

            const downloadTable = [
              '| Platform | Type | Download |',
              '| -------- | ---- | -------- |',
              ...rows.map(([platform, type, name]) =>
                `| ${platform} | ${type} | [${name}](${latestDownload(name)}) |`
              ),
            ].join('\n');

            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            const existingBody = release.body?.trim();
            const generatedNotes = existingBody
              && !existingBody.startsWith('## Downloads')
              ? `\n\n## Generated Notes\n\n${existingBody}`
              : '';

            const body = [
              '## Downloads',
              '',
              downloadTable,
              '',
              'Use the setup `.exe` on Windows, `.dmg` on macOS Apple Silicon, or `.deb` on Ubuntu x64.',
              '',
              '## Signing Status',
              '',
              signed
                ? 'This release was built with signing enabled.'
                : 'This release is unsigned. Windows SmartScreen and macOS Gatekeeper may warn before first launch.',
              generatedNotes,
            ].join('\n');

            await github.request('PATCH /repos/{owner}/{repo}/releases/{release_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: tag,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
