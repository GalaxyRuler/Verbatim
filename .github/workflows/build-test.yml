name: "Build Test"

on:
  workflow_dispatch:
    inputs:
      dev_version:
        description: "Optional Verbatim Dev SemVer to match a Windows dev build, for example 0.8.9-dev.202606171606+24144"
        required: false
        default: ""
        type: string

jobs:
  build-test:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "verbatim-test"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
      dev-version: ${{ inputs.dev_version }}
    secrets: inherit
