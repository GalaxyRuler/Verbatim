name: "macOS Parity"

# Manual macOS Apple Silicon build lane. This keeps macOS parity evidence
# separate from Windows/Linux failures while reusing the canonical build job.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Leave empty to build the workflow ref."
        required: false
        default: ""
        type: string
      sign_binaries:
        description: "Sign macOS artifacts if Apple Developer secrets are configured"
        required: false
        default: false
        type: boolean
      build_profile:
        description: "Build profile"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}-${{ inputs.build_profile }}
  cancel-in-progress: true

jobs:
  macos-apple-silicon:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: ${{ inputs.build_profile == 'debug' && '--debug --target aarch64-apple-darwin' || '--target aarch64-apple-darwin' }}
      sign-binaries: ${{ inputs.sign_binaries }}
      asset-prefix: "verbatim-macos-parity"
      upload-artifacts: true
      ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      is-debug-build: ${{ inputs.build_profile == 'debug' }}
    secrets: inherit
