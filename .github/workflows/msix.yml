name: "MSIX (Store)"

# Builds a Microsoft Store MSIX for Verbatim in a clean Windows CI environment.
# Reuses the proven native-build setup from build.yml (Ninja generator for ggml's
# Vulkan shader-gen, Vulkan SDK, long paths, shortened CARGO_TARGET_DIR, AVX off).
# The Store signs the package, so no code-signing certificate is needed here.
on:
  workflow_dispatch:
    inputs:
      msix_version:
        description: "MSIX package version (4-part, e.g. 0.9.0.0; must be higher than any previously submitted)"
        required: false
        default: "0.9.0.0"

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: msix-windows-x64

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        run: bun install

      # whisper-rs-sys cmake builds create paths that exceed Windows MAX_PATH.
      # Shorten the target dir, and use Ninja (the VS generator trips
      # ExternalProject ordering in ggml's Vulkan shader generator).
      - name: Configure Windows native build
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          echo "TrackFileAccess=false" >> $env:GITHUB_ENV

      - name: Stage Visual C++ runtime DLLs
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stage-windows-vc-runtime.ps1 -Arch x64

      # Disable SIMD above SSE4.2 for broad CPU compatibility (matches release builds).
      - name: Build Verbatim (no installer bundle)
        shell: pwsh
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: bun run tauri build --no-bundle

      - name: Locate build output
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter "verbatim.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) {
            $rel = Join-Path $env:CARGO_TARGET_DIR "release"
            Write-Host "verbatim.exe not found. Contents of ${rel}:"
            if (Test-Path $rel) { Get-ChildItem $rel | Select-Object Name }
            Write-Error "verbatim.exe not found under $env:CARGO_TARGET_DIR"
            exit 1
          }
          $rel = $exe.DirectoryName
          Write-Host "Found exe at: $($exe.FullName)"
          "release=$rel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage MSIX payload
        shell: pwsh
        run: |
          $rel = "${{ steps.out.outputs.release }}"
          $stage = Join-Path $env:GITHUB_WORKSPACE "msix-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $rel "verbatim.exe") $stage
          Copy-Item (Join-Path $rel "*.dll") $stage -ErrorAction SilentlyContinue
          if (Test-Path "src-tauri/resources") {
            Copy-Item "src-tauri/resources" (Join-Path $stage "resources") -Recurse
          }
          Copy-Item "msix/Assets" (Join-Path $stage "Assets") -Recurse
          $ver = "${{ inputs.msix_version }}"
          (Get-Content "msix/Package.appxmanifest") -replace 'Version="0\.9\.0\.0"', "Version=`"$ver`"" |
            Set-Content (Join-Path $stage "Package.appxmanifest")
          Write-Host "Staged payload:"; Get-ChildItem $stage | Select-Object Name, Length

      - name: Install winapp CLI
        shell: pwsh
        run: |
          winget install --id Microsoft.WinAppCli --source winget --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Pack MSIX
        id: pack
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "msix-stage"
          $ver = "${{ inputs.msix_version }}"
          $out = Join-Path $env:GITHUB_WORKSPACE "Verbatim_${ver}_x64.msix"
          winapp package "$stage" --manifest (Join-Path $stage "Package.appxmanifest") --output "$out"
          if (-not (Test-Path $out)) { Write-Error "MSIX was not produced"; exit 1 }
          echo "msix=$out" >> $env:GITHUB_OUTPUT
          Write-Host "Built: $out"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: verbatim-msix-${{ inputs.msix_version }}
          path: ${{ steps.pack.outputs.msix }}
          retention-days: 30
