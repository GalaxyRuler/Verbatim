[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = [
  { allow = ["MIT", "Apache-2.0"], crate = "tauri-nspanel" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/GalaxyRuler/rodio.git",
  "https://github.com/GalaxyRuler/tauri.git",
  "https://github.com/GalaxyRuler/vad-rs",
  "https://github.com/ahkohd/tauri-nspanel",
  "https://github.com/rustdesk-org/rdev",
]
